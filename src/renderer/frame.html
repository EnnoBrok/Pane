<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Pane</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="frame">
  <header id="tabbar" title="Right-click for options">
    <span id="ficon"></span>
    <span id="ftitle"></span>
    <div id="find" hidden>
      <input id="find-q" type="text" placeholder="Find in page" spellcheck="false" autocomplete="off">
      <span id="find-n"></span>
      <button data-find="prev" title="Previous (Shift+Enter)"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5l3-3 3 3"/></svg></button>
      <button data-find="next" title="Next (Enter)"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"/></svg></button>
      <button data-find="close" title="Close (Esc)"><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg></button>
    </div>
  </header>

  <div id="status" hidden>
    <div>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      <h3></h3>
      <p></p>
      <button>Retry now</button>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="frame.js"></script>
</body>
</html>
